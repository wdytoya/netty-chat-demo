syntax = "proto2";

package demo;

option java_multiple_files = true;
option java_package = "org.example.demo.protos";
option java_outer_classname = "RoomProtos";

enum RoomMsgType {
  ROOM_MSG_TYPE_UNSPECIFIED = 0;
  CREATE_ROOM_REQ = 1;
  CREATE_ROOM_RESP = 2;
  LIST_ROOMS_REQ = 3;
  LIST_ROOMS_RESP = 4;
  JOIN_ROOM_REQ = 5;
  JOIN_ROOM_RESP = 6;
  LEAVE_ROOM_REQ = 7;
  LEAVE_ROOM_RESP = 8;
  ROOM_CHAT_REQ = 9;
  ROOM_CHAT_RESP = 10;
  ROOM_CHAT_NOTIFY = 11;
  ROOM_MEMBER_OFFLINE_NOTIFY = 12;
  RECONNECT_ROOM_AVAILABLE = 13;
  RECONNECT_ROOM_CONFIRM_REQ = 14;
  RECONNECT_ROOM_CONFIRM_RESP = 15;
  ROOM_MEMBER_RECONNECTED_NOTIFY = 16;
  ROOM_MEMBER_JOINED_NOTIFY = 17;
  ROOM_MEMBER_LEFT_NOTIFY = 18;
  ROOM_ERROR_RESP = 19;
}

message RoomInfo {
  optional string room_name = 1;
  optional int32 online_count = 2;
}

message CreateRoomReq {
  optional string room_name = 1;
  optional string password = 2;
}

message CreateRoomResp {
  optional bool success = 1;
  optional int32 code = 2;
  optional string message = 3;
  optional string room_name = 4;
}

message ListRoomsReq {
}

message ListRoomsResp {
  repeated RoomInfo rooms = 1;
  optional bool success = 2;
  optional int32 code = 3;
  optional string message = 4;
}

message JoinRoomReq {
  optional string room_name = 1;
  optional string password = 2;
}

message JoinRoomResp {
  optional bool success = 1;
  optional int32 code = 2;
  optional string message = 3;
  optional string room_name = 4;
}

message LeaveRoomReq {
}

message LeaveRoomResp {
  optional bool success = 1;
  optional int32 code = 2;
  optional string message = 3;
  optional string room_name = 4;
}

message RoomChatReq {
  optional string text = 1;
  optional string msg_id = 2;
}

message RoomChatResp {
  optional bool success = 1;
  optional int32 code = 2;
  optional string message = 3;
  optional string msg_id = 4;
}

message RoomChatNotify {
  optional string room_name = 1;
  optional string sender_name = 2;
  optional string msg_id = 3;
  optional string text = 4;
  optional int64 timestamp = 5;
}

message RoomMemberOfflineNotify {
  optional string room_name = 1;
  optional string username = 2;
}

message ReconnectRoomAvailable {
  optional string room_name = 1;
  optional int64 expire_at_ms = 2;
}

message ReconnectRoomConfirmReq {
}

message ReconnectRoomConfirmResp {
  optional bool success = 1;
  optional int32 code = 2;
  optional string message = 3;
  optional string room_name = 4;
}

message RoomMemberReconnectedNotify {
  optional string room_name = 1;
  optional string username = 2;
}

message RoomMemberJoinedNotify {
  optional string room_name = 1;
  optional string username = 2;
}

message RoomMemberLeftNotify {
  optional string room_name = 1;
  optional string username = 2;
}
