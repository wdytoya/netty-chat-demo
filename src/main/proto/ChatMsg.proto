syntax = "proto2";

package demo;

option java_multiple_files = true;
option java_package = "org.example.demo.protos";
option java_outer_classname = "ChatMsgProtos";

message ChatMsg {
  optional int32 server_main_ver = 1;
  optional int32 server_sub_ver = 2;
  optional int32 server_mod_ver = 3;
  optional string session_id = 4;
  optional MsgType msg_type = 5;
  optional int32 msg_len = 6;
  optional string msg_body = 7;

  enum MsgType {
    MSG_TYPE_REQUEST = 0;
    MSG_TYPE_RESPONSE = 1;
    MSG_TYPE_PING = 2;
    MSG_TYPE_PONG = 3;
    MSG_TYPE_EMPTY = 4;
  }
}